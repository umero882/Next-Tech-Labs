server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Emit relative Location headers. TLS terminates at Traefik, so this server
  # only ever sees plain http on :80 — with absolute redirects on (the default)
  # nginx would build "http://nextechlabs.org/..." from what it sees and send a
  # visitor on an extra insecure hop back through the proxy.
  absolute_redirect off;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    image/svg+xml application/xml application/x-font-ttf font/woff font/woff2;

  # Long-cache hashed Vite assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static project images (covers, screenshots) — cache moderately.
  # Use a regex so SPA routes like /projects/password-manager (no extension)
  # fall through to the catch-all SPA fallback below.
  location ~* ^/projects/.+\.(png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # The First Bite blog moved under its project: /blog/<slug> is now
  # /projects/first-bite/blog/<slug>. Those five article URLs were published and
  # indexed, so they 301 rather than 404. /blog itself is reserved for Next Tech
  # Labs' own writing and forwards to First Bite's until there is any.
  #
  # Remove these once the studio blog exists at /blog, or it will shadow it.
  location = /blog {
    return 301 /projects/first-bite/blog;
  }
  location = /blog/ {
    return 301 /projects/first-bite/blog;
  }
  location ~ ^/blog/(?<post_slug>.+)$ {
    return 301 /projects/first-bite/blog/$post_slug;
  }

  # Healthcheck
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SPA fallback for client-side routing.
  #
  # $uri/index.html serves the prerendered pages that scripts/prerender.mjs
  # writes for the blog and app routes — they carry per-route <head> metadata so
  # link unfurlers, which never execute JS, get real titles and OG images. Every
  # other route falls through to the SPA shell as before.
  #
  # Note $uri/index.html, NOT $uri/ — the bare directory form makes nginx do its
  # own index handling and 403 when a directory has no index file.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  # Don't index hidden files
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
